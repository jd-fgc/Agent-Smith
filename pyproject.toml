[project]
name = "agent-smith"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "docker>=7.2.0",
    "fire>=0.7.1",
    "mcp[cli]>=1.28.1",
    "nest-asyncio>=1.6.0",
    "openai>=2.45.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
    "token-count>=0.2.1",
    "uv>=0.11.25",
]
[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["student"]

[project.scripts]
sandbox = "student.__main__:main"
